- name: Run Cilium connectivity test from localhost
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cilium_cli_binary_path: "{{ cilium_cli_install_dir }}/cilium"
  tasks:
  - name: Ensure local kubeconfig exists
    ansible.builtin.stat:
      path: "{{ local_kubeconfig_path }}"
    register: local_kubeconfig

  - name: Fail if local kubeconfig is missing
    ansible.builtin.fail:
      msg: "Local kubeconfig not found at {{ local_kubeconfig_path }}. Run playbook 60-kubeconfig-on-laptop.yaml first."
    when: not local_kubeconfig.stat.exists

  - name: Ensure Cilium CLI exists on localhost
    ansible.builtin.stat:
      path: "{{ cilium_cli_binary_path }}"
    register: local_cilium_cli

  - name: Fail if Cilium CLI is missing
    ansible.builtin.fail:
      msg: "Cilium CLI not found at {{ cilium_cli_binary_path }}. Run playbook 73-install-cilium-cli-local.yaml first."
    when: not local_cilium_cli.stat.exists

  - name: Run Cilium connectivity test
    ansible.builtin.command:
      cmd: >-
        {{ cilium_cli_binary_path }} connectivity test
        --kubeconfig {{ local_kubeconfig_path }}
        --test-namespace cilium-test
        --timeout 15m
    register: cilium_connectivity_test
    changed_when: false
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Cilium connectivity test output
    ansible.builtin.debug:
      msg: "{{ cilium_connectivity_test.stdout_lines }}"