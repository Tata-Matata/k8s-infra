## kubeconfig for admin is copied to local laptop
## so that later we can run kubectl remotely
- name: Control cluster from outside
  hosts: controlplanes[0]
  vars:
    adminconf_controlplane_path: "{{ kubeconfig_path }}"
    adminconf_local_machine_folder: "{{  local_home_dir }}/kubernetes/k8s-infra"
    adminconf_local_machine_path: "{{ adminconf_local_machine_folder }}/admin.conf"
  tasks:
  - name: Make sure folder for admin.conf exists on localhost
    ansible.builtin.file:
      path: "{{ adminconf_local_machine_folder }}"
      mode: '0755'
      state: directory
      owner: "{{ local_user_name }}"
      group: "{{ local_user_group }}"
    delegate_to: localhost

  - name: Fetch admin.conf to local machine
    ansible.builtin.fetch: 
     src: "{{  adminconf_controlplane_path }}"
     dest: "{{  adminconf_local_machine_path }}"
     flat: true

  - name: Read local kubeconfig
    ansible.builtin.slurp:
      path: "{{ adminconf_local_machine_path }}"
    register: local_kubeconfig_raw
    delegate_to: localhost

  - name: Parse local kubeconfig
    ansible.builtin.set_fact:
      local_kubeconfig_data: "{{ local_kubeconfig_raw.content | b64decode | from_yaml }}"
      local_kubeconfig_server: "https://{{ ansible_host }}:6443"

  - name: Rewrite local kubeconfig server endpoint for laptop access
    ansible.builtin.copy:
      dest: "{{ adminconf_local_machine_path }}"
      mode: '0600'
      content: |
        {{
          local_kubeconfig_data
          | combine(
              {
                'clusters': (
                  local_kubeconfig_data.clusters
                  | map('combine', {'cluster': {'server': local_kubeconfig_server}}, recursive=True)
                  | list
                )
              },
              recursive=True
            )
          | to_nice_yaml(indent=2, sort_keys=False)
        }}
    delegate_to: localhost
  
      
  - name: Persist KUBECONFIG in local .bashrc
    ansible.builtin.lineinfile:
      path: "{{ local_home_dir }}/.bashrc"
      line: 'export KUBECONFIG="{{ adminconf_local_machine_path }}"'
      create: true
    delegate_to: localhost
  

