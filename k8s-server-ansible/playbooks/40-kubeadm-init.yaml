- name: Initialize the first control plane
  hosts: controlplanes[0]
  vars:
    admin_conf_path: /etc/kubernetes/admin.conf
    kubeadm_controlplane_private_interface: >-
      {{
        ansible_interfaces
        | select('match', '^en')
        | reject('equalto', ansible_default_ipv4.interface)
        | list
        | first
        | default('')
      }}
  gather_facts: true
  tasks:
  - name: Fail if no private interface can be derived for kubeadm
    ansible.builtin.fail:
      msg: >-
        Could not derive a private interface for the first control plane.
        Define control_plane_endpoint for a stable private API endpoint or adjust
        the interface detection logic.
    when:
      - control_plane_endpoint | length == 0
      - kubeadm_controlplane_private_interface | length == 0

  - name: Detect private API advertise IP on first control plane
    ansible.builtin.shell: "ip -4 -o addr show dev {{ kubeadm_controlplane_private_interface }} | awk '{print $4}' | cut -d/ -f1"
    register: kubeadm_controlplane_private_ip
    changed_when: false
    when: control_plane_endpoint | length == 0

  - name: Derive kubeadm API advertise address
    ansible.builtin.set_fact:
      kubeadm_api_advertise_address: >-
        {{
          control_plane_endpoint.split(':')[0]
          if control_plane_endpoint | length > 0
          else (kubeadm_controlplane_private_ip.stdout | trim)
        }}

  - name: Create config file for kubeadm from Jinja template
    ansible.builtin.template:
      src: kubeadm-init.yaml.j2
      dest: /root/kubeadm-init.yaml
      owner: root
      group: root
      mode: '0600'

  - name: Show detected IP
    ansible.builtin.debug:
      msg: "{{ kubeadm_api_advertise_address }}"

  - name: Stop kubelet service before kubeadm init
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: stopped

  - name: Init cluster with kubeadm
    ansible.builtin.command:
      cmd: kubeadm init --config /root/kubeadm-init.yaml
    args:
      creates: "{{ admin_conf_path }}"

  - name: Ensure root kubeconfig directory exists
    ansible.builtin.file:
      path: /root/.kube
      state: directory
      owner: root
      group: root
      mode: '0700'

  - name: Copy admin kubeconfig for root
    ansible.builtin.copy:
      src: "{{ admin_conf_path }}"
      dest: /root/.kube/config
      remote_src: true
      owner: root
      group: root
      mode: '0600'

  - name: Create worker join command
    ansible.builtin.command: kubeadm token create --print-join-command
    register: worker_join_command_raw
    changed_when: false

  - name: Upload control plane certificates
    ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
    register: upload_certs_output
    changed_when: false

  - name: Persist join data on localhost
    ansible.builtin.set_fact:
      worker_join_command: "{{ worker_join_command_raw.stdout }}"
      controlplane_join_command: "{{ worker_join_command_raw.stdout }} --control-plane --certificate-key {{ upload_certs_output.stdout_lines | last | trim }}"
    delegate_to: localhost
    delegate_facts: true

  - name: Check kubectl on first control plane
    ansible.builtin.command: kubectl get nodes
    changed_when: false

- name: Join additional control planes
  hosts: controlplanes
  gather_facts: false
  tasks:
  - name: Stop kubelet service before control plane join
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: stopped
    when: inventory_hostname != groups['controlplanes'][0]

  - name: Join node as additional control plane
    ansible.builtin.command: "{{ hostvars['localhost'].controlplane_join_command }}"
    args:
      creates: /etc/kubernetes/admin.conf
    when: inventory_hostname != groups['controlplanes'][0]

- name: Join worker nodes
  hosts: workers
  gather_facts: false
  tasks:
  - name: Stop kubelet service before worker join
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: stopped

  - name: Join node as worker
    ansible.builtin.command: "{{ hostvars['localhost'].worker_join_command }}"
    args:
      creates: /etc/kubernetes/kubelet.conf