- name: Initialize the first control plane
  hosts: controlplanes[0]
  vars:
    admin_conf_path: /etc/kubernetes/admin.conf
  gather_facts: true
  tasks:
  - name: Require private_ip in inventory for the first control plane
    ansible.builtin.assert:
      that:
        - private_ip is defined
        - private_ip | length > 0
      fail_msg: >-
        private_ip must be set in inventory for the first control plane.

  - name: Create config file for kubeadm from Jinja template
    ansible.builtin.template:
      src: templates/kubeadm-init.yaml.j2
      dest: /root/kubeadm-init.yaml
      owner: root
      group: root
      mode: '0600'

  - name: Show detected IP
    ansible.builtin.debug:
      msg: "{{ private_ip }}"

  - name: Stop kubelet service before kubeadm init
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: stopped

  - name: Init cluster with kubeadm
    ansible.builtin.command:
      cmd: kubeadm init --config /root/kubeadm-init.yaml
    args:
      creates: "{{ admin_conf_path }}"

  - name: Ensure root kubeconfig directory exists
    ansible.builtin.file:
      path: /root/.kube
      state: directory
      owner: root
      group: root
      mode: '0700'

  - name: Copy admin kubeconfig for root
    ansible.builtin.copy:
      src: "{{ admin_conf_path }}"
      dest: /root/.kube/config
      remote_src: true
      owner: root
      group: root
      mode: '0600'

  - name: Check kubectl on first control plane
    ansible.builtin.command: kubectl get nodes
    changed_when: false