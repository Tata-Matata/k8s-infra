# Generate fresh join data on the first control plane and use it to add any
# additional control-plane nodes declared in inventory.
- name: Prepare additional control plane join command
  hosts: controlplanes[0]
  gather_facts: false
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: prepare and run joins for additional control-plane nodes"

  - name: Require initialized first control plane
    ansible.builtin.stat:
      path: "{{ kubeconfig_path }}"
    register: admin_conf_stat

  - name: Fail if first control plane is not initialized
    ansible.builtin.assert:
      that:
        - admin_conf_stat.stat.exists
      fail_msg: >-
        {{ kubeconfig_path }} is missing on the first control plane.
        Run 40-kubeadm-init.yaml before joining additional control planes.

  - name: Create base join command
    ansible.builtin.command: kubeadm token create --print-join-command --kubeconfig {{ kubeconfig_path }}
    register: worker_join_command_raw
    changed_when: false

  # kubeadm uploads shared control-plane certificates into the cluster and
  # returns a temporary certificate key. Additional control planes use that
  # key with `kubeadm join --control-plane` instead of requiring manual
  # certificate distribution.
  - name: Upload control plane certificates
    ansible.builtin.command: kubeadm init phase upload-certs --upload-certs --kubeconfig {{ kubeconfig_path }}
    register: upload_certs_output
    changed_when: false
    retries: 5
    delay: 15
    until: upload_certs_output.rc == 0

  - name: Persist control plane join data on localhost
    ansible.builtin.set_fact:
      controlplane_join_command: "{{ worker_join_command_raw.stdout }} --control-plane --certificate-key {{ upload_certs_output.stdout_lines | last | trim }}"
    delegate_to: localhost
    delegate_facts: true

- name: Join additional control planes
  hosts: controlplanes
  gather_facts: false
  tasks:
  - name: Stop kubelet service before control plane join
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: stopped
    when: inventory_hostname != groups['controlplanes'][0]

  - name: Join node as additional control plane
    ansible.builtin.command: "{{ hostvars['localhost'].controlplane_join_command }}"
    args:
      creates: "{{ kubeconfig_path }}"
    when: inventory_hostname != groups['controlplanes'][0]