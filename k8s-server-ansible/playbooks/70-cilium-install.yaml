# Install Cilium from the laptop with Helm after the control plane is ready and
# the local admin kubeconfig and Helm binary are in place.
- name: Install Cilium with VXLAN via Helm from localhost
  hosts: controlplanes[0]
  gather_facts: false
  vars:
    helm_binary_path: "{{ helm_install_dir }}/helm"
    cilium_values_file: /tmp/cilium-values.yaml
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: install Cilium from the laptop with Helm"

  - name: Ensure local kubeconfig exists
    ansible.builtin.stat:
      path: "{{ cilium_kubeconfig_local_path }}"
    register: local_kubeconfig
    delegate_to: localhost

  - name: Fail if local kubeconfig is missing
    ansible.builtin.fail:
      msg: "Local kubeconfig not found at {{ cilium_kubeconfig_local_path }}. Run playbook 42-proxy-to-laptop.yaml first."
    when: not local_kubeconfig.stat.exists

  - name: Ensure Helm binary exists on localhost
    ansible.builtin.stat:
      path: "{{ helm_binary_path }}"
    register: local_helm
    delegate_to: localhost

  - name: Fail if Helm binary is missing
    ansible.builtin.fail:
      msg: "Helm not found at {{ helm_binary_path }}. Run playbook 60-install-helm-local.yaml first."
    when: not local_helm.stat.exists

  - name: Require private_ip for Cilium kube-apiserver access
    ansible.builtin.assert:
      that:
        - private_ip is defined
        - private_ip | length > 0
      fail_msg: private_ip must be set on the first control plane for Cilium installation.

  - name: Write Cilium Helm values file on localhost
    ansible.builtin.template:
      src: templates/cilium-values.yaml.j2
      dest: "{{ cilium_values_file }}"
      mode: '0600'
    delegate_to: localhost

  - name: Install or upgrade Cilium from OCI chart
    ansible.builtin.command:
      cmd: >-
        {{ helm_binary_path }} upgrade --install {{ cilium_release_name }}
        oci://quay.io/cilium/charts/cilium
        --version {{ cilium_version }}
        --namespace {{ cilium_namespace }}
        --create-namespace
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        --values {{ cilium_values_file }}
        --wait
        --timeout 10m
    register: cilium_install
    delegate_to: localhost
    changed_when: true
    environment:
      PATH: "{{ helm_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Cilium Helm result
    ansible.builtin.debug:
      msg: "{{ cilium_install.stdout_lines | default([]) }}"
