# Install Helm on the laptop so cluster add-ons can be managed locally against
# the fetched admin kubeconfig.
- name: Install Helm on localhost for cluster administration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    helm_archive_name: "helm-v{{ helm_version }}-{{ helm_arch }}.tar.gz"
    helm_archive_path: "{{ helm_tmp_dir }}/{{ helm_archive_name }}"
    helm_extract_dir: "{{ helm_tmp_dir }}/{{ helm_arch }}"
    helm_binary_path: "{{ helm_install_dir }}/helm"
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: install Helm locally for cluster administration"

  - name: Ensure local Helm install dir exists
    ansible.builtin.file:
      path: "{{ helm_install_dir }}"
      state: directory
      mode: '0755'

  - name: Ensure local Helm temp dir exists
    ansible.builtin.file:
      path: "{{ helm_tmp_dir }}"
      state: directory
      mode: '0700'

  - name: Download Helm archive to localhost
    ansible.builtin.get_url:
      url: "{{ helm_download_url }}"
      dest: "{{ helm_archive_path }}"
      mode: '0644'
      checksum: "{{ helm_checksum }}"

  - name: Unpack Helm archive on localhost
    ansible.builtin.unarchive:
      src: "{{ helm_archive_path }}"
      dest: "{{ helm_tmp_dir }}"
      remote_src: true

  - name: Install Helm binary on localhost
    ansible.builtin.copy:
      src: "{{ helm_extract_dir }}/helm"
      dest: "{{ helm_binary_path }}"
      remote_src: true
      mode: '0755'

  - name: Verify Helm is installed on localhost
    ansible.builtin.command:
      cmd: "{{ helm_binary_path }} version --short"
    register: helm_check
    changed_when: false
    environment:
      PATH: "{{ helm_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Helm version
    ansible.builtin.debug:
      msg: "{{ helm_check.stdout }}"

  - name: Verify Helm version
    ansible.builtin.assert:
      that:
        - "'v' ~ helm_version in helm_check.stdout"
      fail_msg: "Helm is not the expected version"
