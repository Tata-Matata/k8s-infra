# Keep the default kubeadm behavior so workload pods do not land on control-
# plane nodes unless they explicitly tolerate the taint.
- name: Enforce the NoSchedule taint on control-plane nodes
  hosts: controlplanes
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: enforce the control-plane NoSchedule taint"
  
  
  - name: Ensure controlplane taint is present
    ansible.builtin.command: 
     cmd: kubectl --kubeconfig {{ kubeconfig_path }} taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane=:NoSchedule
    register: taint_controlplane
    failed_when: >-
      taint_controlplane.rc != 0 and
      'already has' not in taint_controlplane.stderr
    changed_when: "'tainted' in taint_controlplane.stdout"

  - name: Log taints
    ansible.builtin.command:
      cmd: kubectl --kubeconfig {{ kubeconfig_path }} get node {{ inventory_hostname }} -o jsonpath={.spec.taints[*].key}
    register: controlplane_taints
    changed_when: false

  - name: Check taint exists on controlplane node
    ansible.builtin.assert:
      that:
        - "'node-role.kubernetes.io/control-plane' in controlplane_taints.stdout"
      fail_msg: "Control plane node is missing the NoSchedule taint"
