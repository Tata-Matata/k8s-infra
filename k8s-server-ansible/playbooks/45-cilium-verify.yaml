- name: Verify Cilium installation from localhost
  hosts: controlplanes[0]
  vars:
    kubectl_local_path: "/home/tati/.local/bin/kubectl"
  tasks:
  - name: Check Cilium pods in kube-system
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get pods
        -l k8s-app=cilium
    register: cilium_pods
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Cilium pods
    ansible.builtin.debug:
      msg: "{{ cilium_pods.stdout_lines }}"

  - name: Check Cilium operator
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get deployment cilium-operator
    register: cilium_operator
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Cilium operator
    ansible.builtin.debug:
      msg: "{{ cilium_operator.stdout_lines }}"

  - name: Verify Cilium config is VXLAN
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get configmap cilium-config
        -o jsonpath={.data.tunnel-protocol}
    register: cilium_tunnel_protocol_check
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Verify tunnel protocol value
    ansible.builtin.assert:
      that:
        - cilium_tunnel_protocol_check.stdout == cilium_tunnel_protocol
      fail_msg: "Cilium tunnel protocol is not the expected value"

  - name: Verify Hubble is enabled in Cilium config
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get configmap cilium-config
        -o jsonpath={.data.enable-hubble}
    register: cilium_hubble_enabled_check
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Verify Hubble config value
    ansible.builtin.assert:
      that:
        - cilium_hubble_enabled_check.stdout == 'true'
      fail_msg: "Hubble is not enabled in the Cilium config"

  - name: Check Hubble Relay deployment
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get deployment hubble-relay
    register: hubble_relay_deployment
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Hubble Relay deployment
    ansible.builtin.debug:
      msg: "{{ hubble_relay_deployment.stdout_lines }}"

  - name: Check Hubble UI deployment
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get deployment hubble-ui
    register: hubble_ui_deployment
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Hubble UI deployment
    ansible.builtin.debug:
      msg: "{{ hubble_ui_deployment.stdout_lines }}"

  - name: Check Hubble Relay service
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        get service hubble-relay
    register: hubble_relay_service
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Hubble Relay service
    ansible.builtin.debug:
      msg: "{{ hubble_relay_service.stdout_lines }}"

  - name: Check kube-proxy replacement status from cilium agent
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n {{ cilium_namespace }}
        exec ds/cilium -- cilium-dbg status --verbose
    register: cilium_dbg_status
    changed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Verify kube-proxy replacement is enabled
    ansible.builtin.assert:
      that:
        - "'KubeProxyReplacement:   True' in cilium_dbg_status.stdout"
        - "'- HostPort:       Enabled' in cilium_dbg_status.stdout"
      fail_msg: "Cilium kube-proxy replacement is not fully enabled"

  - name: Check kube-proxy daemonset is absent
    ansible.builtin.command:
      cmd: >-
        {{ kubectl_local_path }}
        --kubeconfig {{ cilium_kubeconfig_local_path }}
        -n kube-system
        get daemonset kube-proxy
    register: kube_proxy_daemonset
    changed_when: false
    failed_when: false
    delegate_to: localhost
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Verify kube-proxy daemonset is absent
    ansible.builtin.assert:
      that:
        - kube_proxy_daemonset.rc != 0
      fail_msg: "kube-proxy daemonset still exists"

