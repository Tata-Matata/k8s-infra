# Run local Cilium CLI status commands against the fetched kubeconfig to check
# overall health and Hubble readiness after installation.
- name: Run Cilium status checks from localhost
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cilium_cli_binary_path: "{{ cilium_cli_install_dir }}/cilium"
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: run local Cilium status checks"

  - name: Ensure local kubeconfig exists
    ansible.builtin.stat:
      path: "{{ local_kubeconfig_path }}"
    register: local_kubeconfig

  - name: Fail if local kubeconfig is missing
    ansible.builtin.fail:
      msg: "Local kubeconfig not found at {{ local_kubeconfig_path }}. Run playbook 60-kubeconfig-on-laptop.yaml first."
    when: not local_kubeconfig.stat.exists

  - name: Ensure Cilium CLI exists on localhost
    ansible.builtin.stat:
      path: "{{ cilium_cli_binary_path }}"
    register: local_cilium_cli

  - name: Fail if Cilium CLI is missing
    ansible.builtin.fail:
      msg: "Cilium CLI not found at {{ cilium_cli_binary_path }}. Run playbook 73-install-cilium-cli-local.yaml first."
    when: not local_cilium_cli.stat.exists

  - name: Wait for Cilium status to become healthy
    ansible.builtin.command:
      cmd: >-
        {{ cilium_cli_binary_path }} status
        --wait
        --wait-duration 10m
        --kubeconfig {{ local_kubeconfig_path }}
    register: cilium_status
    changed_when: false
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Cilium status
    ansible.builtin.debug:
      msg: "{{ cilium_status.stdout_lines }}"

  - name: Check Hubble status through Cilium CLI
    ansible.builtin.command:
      cmd: >-
        {{ cilium_cli_binary_path }} hubble status
        --kubeconfig {{ local_kubeconfig_path }}
    register: hubble_status
    changed_when: false
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Hubble status
    ansible.builtin.debug:
      msg: "{{ hubble_status.stdout_lines }}"
