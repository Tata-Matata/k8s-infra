# Restart CoreDNS after Cilium installation so a workload that started before
# the Cilium CNI was active gets recreated with the expected networking.
- name: Restart pre-Cilium unmanaged pods
  hosts: controlplanes[0]
  gather_facts: false
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: restart workloads that predate the Cilium CNI"

  - name: Restart CoreDNS deployment in kube-system
    ansible.builtin.command:
      cmd: >-
        kubectl
        --kubeconfig {{ kubeconfig_path }}
        -n kube-system
        rollout restart deployment coredns
    register: coredns_restart
    changed_when: true

  - name: Wait for CoreDNS rollout
    ansible.builtin.command:
      cmd: >-
        kubectl
        --kubeconfig {{ kubeconfig_path }}
        -n kube-system
        rollout status deployment coredns --timeout=5m
    register: coredns_rollout
    changed_when: false

  - name: Show CoreDNS rollout status
    ansible.builtin.debug:
      msg: "{{ coredns_rollout.stdout_lines }}"
