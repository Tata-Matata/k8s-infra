apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-api-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-api-client
  template:
    metadata:
      labels:
        app: k8s-api-client
    spec:
      serviceAccountName: k8s-api-client
      containers:
      - name: web
        image: docker.io/tatamatata/k8s-api-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-api-client
  namespace: default
spec:
  selector:
    app: k8s-api-client
  ports:
  - name: http
    port: 8888
    targetPort: 8080