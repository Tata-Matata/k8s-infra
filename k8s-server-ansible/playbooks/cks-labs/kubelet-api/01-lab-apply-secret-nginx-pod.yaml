- name: Apply secret-backed nginx pod manifest
  hosts: k8s-playground
  become: true

  vars:
    kubelet_api_lab_dir: /root/labs/kubelet-api
    kubelet_api_manifest_src: resources/01-lab-secret-nginx-pod.yaml
    kubelet_api_manifest_dest: /root/labs/kubelet-api/01-lab-secret-nginx-pod.yaml
    kubeconfig_path: /etc/kubernetes/admin.conf

  tasks:
  - name: Ensure kubelet-api lab directory exists
    ansible.builtin.file:
      path: "{{ kubelet_api_lab_dir }}"
      state: directory
      owner: root
      group: root
      mode: "0755"

  - name: Copy secret-backed nginx manifest to the control-plane host
    ansible.builtin.copy:
      src: "{{ kubelet_api_manifest_src }}"
      dest: "{{ kubelet_api_manifest_dest }}"
      owner: root
      group: root
      mode: "0644"

  - name: Apply secret-backed nginx manifest to the cluster
    ansible.builtin.command:
      cmd: kubectl --kubeconfig {{ kubeconfig_path }} apply -f {{ kubelet_api_manifest_dest }}
    register: kubelet_api_apply
    changed_when: >-
      'created' in kubelet_api_apply.stdout or
      'configured' in kubelet_api_apply.stdout or
      'unchanged' not in kubelet_api_apply.stdout
