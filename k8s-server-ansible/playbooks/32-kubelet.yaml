- name: Install and enable kubelet
  hosts: k8s_cluster
  gather_facts: true
  vars:
    kubelet_node_ip_interface: >-
      {{
        ((inventory_hostname in groups['controlplanes'])
          | ternary(
              (ansible_interfaces | select('match', '^en') | reject('equalto', ansible_default_ipv4.interface) | list | first),
              (ansible_interfaces | select('match', '^en') | list | first)
          ))
          | default(ansible_default_ipv4.interface)
      }}
  tasks:
  # Update apt package index 
  - name: Update apt package index
    ansible.builtin.apt:
      update_cache: true

  - name: Install kubelet
    ansible.builtin.apt:
      name:
      - kubelet
      state: present

  - name: apt-mark hold kubelet
    ansible.builtin.dpkg_selections:
      name: kubelet
      selection: hold

  - name: Detect kubelet node IP on chosen interface
    ansible.builtin.shell: "ip -4 -o addr show dev {{ kubelet_node_ip_interface }} | awk '{print $4}' | cut -d/ -f1"
    register: kubelet_node_ip_detected
    changed_when: false

  - name: Persist kubelet node IP
    ansible.builtin.lineinfile:
      path: /etc/default/kubelet
      regexp: '^KUBELET_EXTRA_ARGS='
      line: 'KUBELET_EXTRA_ARGS="--node-ip={{ kubelet_node_ip_detected.stdout | trim }}"'
      create: true
      mode: '0644'
      owner: root
      group: root
    register: kubelet_extra_args

  - name: Enable kubelet service
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: started
      daemon_reload: true
    when: not kubelet_extra_args.changed

  - name: Restart kubelet to apply node IP
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: restarted
      daemon_reload: true
    when: kubelet_extra_args.changed
  
  ## POST verification

  # collects Ansible service facts from the target host
  # it populates variables under ansible_facts.services
  # for our check we need ansible_facts.services['kubelet.service'].status
  - name: Gather service facts
    ansible.builtin.service_facts:
  
  - name: Verify kubelet is enabled and running
    ansible.builtin.assert:
      that: 
        - "'kubelet.service' in ansible_facts.services"
        - ansible_facts.services['kubelet.service'].status == 'enabled'
        - ansible_facts.services['kubelet.service'].state == 'running'
      fail_msg: "kubelet service is not enabled and running"