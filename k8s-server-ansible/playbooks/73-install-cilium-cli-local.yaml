# Install the Cilium CLI on the laptop so status and connectivity checks can be
# run locally against the cluster.
- name: Install Cilium CLI on localhost
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cilium_cli_archive_path: "/tmp/{{ cilium_cli_archive_name }}"
    cilium_cli_binary_path: "{{ cilium_cli_install_dir }}/cilium"
  tasks:
  - name: Log playbook header
    ansible.builtin.debug:
      msg: "Playbook header: install the Cilium CLI on the laptop"

  - name: Ensure local CLI install dir exists
    ansible.builtin.file:
      path: "{{ cilium_cli_install_dir }}"
      state: directory
      mode: '0755'

  - name: Download Cilium CLI archive to localhost
    ansible.builtin.get_url:
      url: "{{ cilium_cli_download_url }}"
      dest: "{{ cilium_cli_archive_path }}"
      mode: '0644'
      checksum: "{{ cilium_cli_checksum }}"
      force: true

  - name: Extract Cilium CLI binary on localhost
    ansible.builtin.unarchive:
      src: "{{ cilium_cli_archive_path }}"
      dest: "{{ cilium_cli_install_dir }}"
      include:
        - cilium
      remote_src: true

  - name: Ensure Cilium CLI binary mode is executable
    ansible.builtin.file:
      path: "{{ cilium_cli_binary_path }}"
      mode: '0755'

  - name: Verify Cilium CLI is installed
    ansible.builtin.command:
      cmd: "{{ cilium_cli_binary_path }} version --client"
    register: cilium_cli_check
    changed_when: false
    environment:
      PATH: "{{ cilium_cli_install_dir }}:{{ lookup('env', 'PATH') }}"

  - name: Show Cilium CLI version
    ansible.builtin.debug:
      msg: "{{ cilium_cli_check.stdout_lines }}"

  - name: Verify Cilium CLI version
    ansible.builtin.assert:
      that:
        - "'v' ~ cilium_cli_version in cilium_cli_check.stdout"
      fail_msg: "Cilium CLI is not the expected version"
