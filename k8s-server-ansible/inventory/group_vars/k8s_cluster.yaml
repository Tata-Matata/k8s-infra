kubeconfig_path: /etc/kubernetes/admin.conf
containerd_version: "2.3.5"
containerd_service_sha256: "sha256:1941362cbaa89dd591b99c32b050d82c583d3cd2e5fa63085d7017457ec5fca8"
runc_version: "1.5.1"
crictl_version: "v1.37.0"
private_network_cidr: "10.50.0.0/16"
# Set this to a stable private DNS name or VIP with port 6443 when you have
# more than one control plane, for example "cp.k8s.example.com:6443".
#
# This is optional and cluster-wide. It does not replace each control plane
# node's required private_ip in inventory, which kubeadm still uses as the
# local advertiseAddress for that node.
#
# After the first control plane runs kubeadm init, the other control planes
# should join through a stable API endpoint, not through the first node's
# individual IP. Leave it empty for a single-control-plane cluster.
control_plane_endpoint: ""

# cluster networking
pod_network_cidr: "192.168.0.0/16"

# Cilium
cilium_version: "1.20.2"
cilium_namespace: kube-system
cilium_routing_mode: tunnel
cilium_tunnel_protocol: vxlan
cilium_tunnel_port: 8472
cilium_kubeconfig_local_path: "{{ local_kubeconfig_path }}"
cilium_release_name: cilium
cilium_hubble_enabled: true
cilium_hubble_relay_enabled: true
cilium_hubble_ui_enabled: true

# CIS CAT Lite
cis_cat_install_dir: /opt/CIS-CAT-Lite
java_version: "21"
java_runtime_dir: /opt/temurin-jre-{{ java_version }}